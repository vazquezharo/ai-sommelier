name: Verify AI Sommelier
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: google-chrome --version
        timeout-minutes: 1
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sommelier-browser-report
          path: playwright-report
